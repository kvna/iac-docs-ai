  - acronym: "IaC"
    full_term: "iac"
  - acronym: "HCL"
    full_term: "hcl"
  - acronym: "ARM"
    full_term: "azure_resource_manager"
  - acronym: "RG"
    full_term: "resource_group"
  - acronym: "RBAC"
    full_term: "rbac"
  - acronym: "NSG"
    full_term: "nsg"
